name: Veille commerces Paris

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lancer la veille
        run: python3 veille_paris_commerces.py

      - name: Enregistrer les résultats dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vus.json resultats/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Veille du $(date +'%Y-%m-%d %H:%M') : mise à jour des résultats"
            git push
          else
            echo "Rien de nouveau à committer."
          fi
